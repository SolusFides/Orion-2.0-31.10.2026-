services:
  api:
    build:
      context: ./api_gateway
      dockerfile: docker/Dockerfile
    container_name: orion-home-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./api_gateway/.env
    volumes:
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # frontend: раскомментировать, когда во frontend/ будет React-приложение
